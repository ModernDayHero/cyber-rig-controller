<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#000000" />
    <title>Jack In</title>
    <link rel="icon" type="image/svg+xml" href="octlet.svg" />
  </head>
  <body>
    <main class="rig guest" id="app">
      <header class="top">
        <div class="brand">
          <img class="brand-mark" src="octlet.svg" alt="" />
          <span class="brand-name">STEAMWorkz//<wbr />GUEST&nbsp;PORT</span>
        </div>
        <span class="current" id="gState">OFFLINE</span>
      </header>

      <!-- knocking -->
      <section class="panel" id="gJoin" aria-label="Jack in">
        <div class="seg seg5 glang" id="gLang" aria-label="Language"></div>
        <div class="seg gstyle" id="gStyle" aria-label="Words">
          <button data-style="plain"></button>
          <button data-style="night">NIGHT CITY</button>
        </div>
        <!-- A phone that's been here before: the same person again, or someone new? -->
        <div class="who" id="gWho" hidden>
          <p class="gbig" data-i18n="whoTitle"></p>
          <button class="connect" id="gReturning"></button>
          <button class="ghost send" id="gNewGuest" data-i18n="newGuest"></button>
        </div>
        <div class="steps" id="gSteps">
        <p class="gstep" id="gStepNo">1 / 3</p>
        <!-- One step at a time: the current one lit, the rest dimmed; NEXT unlocks the next. -->
        <div class="step" data-step="1">
          <p class="hint" data-i18n="intro"></p>
          <p class="consent" data-i18n="consent"></p>
          <button class="connect" id="gAgree" data-i18n="agree"></button>
        </div>
        <div class="step" data-step="2">
          <label class="label" for="gName" data-i18n="handleLabel"></label>
          <input class="text" id="gName" maxlength="12" data-i18n-ph="handle" autocomplete="nickname" enterkeyhint="next" />
          <button class="connect" id="gNext" data-i18n="next"></button>
        </div>
        <div class="step" data-step="3">
          <label class="label" for="gPass" data-i18n="codeLabel"></label>
          <input class="text code" id="gPass" type="text" maxlength="7" data-i18n-ph="password" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" />
          <span class="hint" data-i18n="codeHelp"></span>
          <p class="hint" id="gJoinNote" hidden></p>
          <button class="connect" id="gJoinBtn" data-i18n="jackIn"></button>
        </div>
        </div>
      </section>

      <section class="panel" id="gWait" hidden aria-live="polite">
        <p class="gbig" data-i18n="handshake"></p>
        <p class="hint" id="gWaitHint"></p>
      </section>

      <!-- in -->
      <div class="view" id="gPlay" hidden>
        <div class="row">
          <span class="label" data-i18n="access"></span>
          <span class="gtime" id="gTime">0:00</span>
          <span class="gaccess" id="gAccess"></span>
          <button class="ghost go" id="gLeave" data-i18n="leave"></button>
        </div>
        <p class="banner" id="gNote" hidden></p>
        <p class="gturn" id="gTurn" hidden></p>
        <!-- What they can do right now: ✓ ready, ⏳ their turn's coming, 🔒 locked. Tap to go there. -->
        <section class="gcan" aria-label="What you can do">
          <span class="label" data-i18n="canTitle"></span>
          <div class="gchips" id="gCan"></div>
        </section>

        <section class="panel gdebug" aria-label="DEBUG">
          <p class="gbig">DEBUG // BYTE vs BUG.EXE</p>
          <span class="hint" id="gDebugHint"></span>
          <div class="seg gplay">
            <button id="gPlayGame" data-i18n="play"></button>
            <button id="gSkip" data-i18n="skipBtn"></button>
          </div>
        </section>

        <div class="panel" data-perm="modes">
          <nav class="tabs" id="gTabs" aria-label="Mode set"></nav>
          <section class="modes" id="gModes" aria-label="Modes"></section>
        </div>

        <section class="panel" data-perm="hack" aria-label="The virus">
          <button class="ghost send danger" id="gHack"></button>
          <span class="hint" id="gHackHint"></span>
        </section>

        <section class="panel" data-perm="say" aria-label="Say something">
          <div class="row">
            <input class="text" id="gText" maxlength="24" data-i18n-ph="wordPh" enterkeyhint="send" />
            <button class="ghost go" id="gSay" data-i18n="send"></button>
          </div>
          <span class="hint" data-i18n="wordHint"></span>
        </section>

        <section class="panel" data-perm="pic" aria-label="Pictures">
          <span class="label" data-i18n="pictures"></span>
          <div class="pics" id="gPics"></div>
        </section>

        <section class="panel" data-perm="drive" id="gDrive" hidden aria-label="Drive the BOLT">
          <span class="label" data-i18n="driveTitle"></span>
          <div class="stick" id="gStick"><div class="knob" id="gKnob"></div></div>
          <span class="hint" data-i18n="driveHint"></span>
        </section>

        <section class="panel" data-perm="motors" id="gMotors" hidden aria-label="Motors">
          <span class="label" data-i18n="motorsTitle"></span>
          <div class="gmotors" id="gMotorList"></div>
          <span class="hint" data-i18n="motorsHint"></span>
        </section>

        <section class="panel" data-perm="up" aria-label="Send your own picture">
          <span class="label" data-i18n="yourPic"></span>
          <div class="imgrow">
            <canvas class="pix pic-pix" id="gUpPreview" width="16" height="16"></canvas>
            <div class="imgctl">
              <label class="file">
                <input type="file" id="gUpFile" accept="image/png,image/jpeg,image/gif,image/webp" />
                <span data-i18n="pickImage"></span>
              </label>
              <input class="text" id="gUpCaption" maxlength="20" data-i18n-ph="captionPh" />
              <span class="hint" data-i18n="picHint"></span>
            </div>
          </div>
          <button class="ghost send" id="gUpSend" data-i18n="sendPic" disabled></button>
        </section>
      </div>

      <!-- DEBUG: Byte vs BUG.EXE (public/viz) full screen; it posts its result back -->
      <div class="game" id="gGame" hidden>
        <iframe id="gGameFrame" title="Byte vs BUG.EXE" allow="autoplay"></iframe>
        <button class="ghost close" id="gGameClose" data-i18n="close"></button>
      </div>

      <!-- PWNED: our own page plays dead for a few seconds, then owns up -->
      <section class="pwned" id="gPwn" hidden aria-live="assertive">
        <pre class="pwn-log" id="gPwnLog"></pre>
        <p class="pwn-big" data-text="I PWNED YOU">I PWNED YOU</p>
        <p class="pwn-sub" data-i18n="pwnSub"></p>
        <p class="pwn-by" id="gPwnBy"></p>
      </section>

      <!-- out -->
      <section class="panel" id="gEnd" hidden aria-live="polite">
        <p class="gbig" id="gEndTitle">DISCONNECTED</p>
        <p class="hint" id="gEndWhy"></p>
        <button class="connect" id="gAgain" data-i18n="again"></button>
      </section>
    </main>
    <script type="module" src="/src/guest.js"></script>
  </body>
</html>
